services:
  # ============================================================================
  # 1. Backend: Node.js Express & TypeScript API + Puppeteer PDF (Supabase Edition)
  # ============================================================================
  backend:
    build:
      context: ./agrilog-backend
      dockerfile: Dockerfile
    container_name: agrilog-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - path: ./agrilog-backend/.env
        required: false
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_POOLER_URL: ${DATABASE_POOLER_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: "${JWT_SECRET:?Bat buoc phai cau hinh JWT_SECRET trong file .env}"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-agrilog}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      SEPAY_API_KEY: ${SEPAY_API_KEY:-}
      SEPAY_ACC_NUMBER: ${SEPAY_ACC_NUMBER:-}
      SEPAY_BANK: ${SEPAY_BANK:-MBBank}
      SEPAY_ACC_NAME: ${SEPAY_ACC_NAME:-}
      SEPAY_WEBHOOK_KEY: ${SEPAY_WEBHOOK_KEY:-}
      SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET:-}
      ALLOW_DEV_SIMULATE: ${ALLOW_DEV_SIMULATE:-true}
      ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID:-}
      ONESIGNAL_REST_API_KEY: ${ONESIGNAL_REST_API_KEY:-}
    networks:
      - agrilog-net

  # ============================================================================
  # 2. Frontend: Next.js 16 (Standalone Production Build)
  # ============================================================================
  frontend:
    build:
      context: ./agrilog-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
        NEXT_PUBLIC_ONESIGNAL_APP_ID: ${NEXT_PUBLIC_ONESIGNAL_APP_ID:-}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    container_name: agrilog-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
      NEXT_PUBLIC_ONESIGNAL_APP_ID: ${NEXT_PUBLIC_ONESIGNAL_APP_ID:-}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    networks:
      - agrilog-net

# ==============================================================================
# Network Topology
# ==============================================================================
networks:
  agrilog-net:
    name: agrilog-net
    driver: bridge
