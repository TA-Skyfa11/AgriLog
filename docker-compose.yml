services:
  # ============================================================================
  # 1. Database: MongoDB 7.0 (Chỉ kích hoạt khi dev offline qua profile "local-db")
  # ============================================================================
  mongo:
    image: mongo:7.0
    container_name: agrilog-mongo
    profiles:
      - local-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: agrilog
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' --quiet || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agrilog-net

  # ============================================================================
  # 2. Backend: Node.js Express & TypeScript API + Puppeteer PDF
  # ============================================================================
  backend:
    build:
      context: ./agrilog-backend
      dockerfile: Dockerfile
    container_name: agrilog-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - path: ./agrilog-backend/.env
        required: false
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: "${MONGO_URI:?Bat buoc phai cau hinh MONGO_URI tro ve Atlas trong file .env}"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: "${JWT_SECRET:?Bat buoc phai cau hinh JWT_SECRET trong file .env}"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-agrilog}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      SEPAY_API_KEY: ${SEPAY_API_KEY:-}
      SEPAY_ACC_NUMBER: ${SEPAY_ACC_NUMBER:-}
      SEPAY_BANK: ${SEPAY_BANK:-MBBank}
      SEPAY_ACC_NAME: ${SEPAY_ACC_NAME:-}
      SEPAY_WEBHOOK_KEY: ${SEPAY_WEBHOOK_KEY:-}
    networks:
      - agrilog-net

  # ============================================================================
  # 3. Frontend: Next.js 16 (Standalone Production Build)
  # ============================================================================
  frontend:
    build:
      context: ./agrilog-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    container_name: agrilog-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      PORT: 3000
      NODE_ENV: production
    networks:
      - agrilog-net

# ==============================================================================
# Persistent Volumes & Network Topology
# ==============================================================================
volumes:
  mongo_data:
    name: agrilog_mongo_data

networks:
  agrilog-net:
    name: agrilog-net
    driver: bridge
